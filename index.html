<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бомба — игра на время</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game">
        <div class="game-header">
            <!-- <div class="badge">⚠️ DANGER ZONE</div> -->
            <h1>TIME BOMB</h1>
            <p class="subtitle">Угадай правильный цвет и обезвредь бомбу!</p>
        </div>

        <section class="bomb-container">
            <!-- <div class="bomb" id="bomb">
                <div class="bomb-wire"></div>
                <div class="bomb-top"></div>
                <div class="bomb-body">
                    <span class="bomb-icon">💣</span>
                </div>
            </div> -->

            <div class="timer" id="timer">00:30</div>
            <p class="timer-label">ОСТАЛОСЬ ВРЕМЕНИ</p>
        </section>

        <section class="stats">
            <div class="stat-card">
                <span class="stat-icon">❤️</span>
                <div>
                    <p class="stat-label">Attempts</p>
                    <h2 id="attempts">3</h2>
                </div>
            </div>

            <div class="stat-card">
                <span class="stat-icon">🎯</span>
                <div>
                    <p class="stat-label">Угадано</p>
                    <h2 id="score">0</h2>
                </div>
            </div>
        </section>

        <section class="game-controls">
            <h2>Выбери провод</h2>
            <p class="instruction">
                Только один цвет поможет обезвредить бомбу!
            </p>

            <div class="color-buttons">
                <button class="color-btn red" data-color="red" disabled>
                    <span class="color-circle"></span>
                    RED
                </button>

                <button class="color-btn blue" data-color="blue" disabled>
                    <span class="color-circle"></span>
                    BLUE
                </button>

                <button class="color-btn green" data-color="green" disabled>
                    <span class="color-circle"></span>
                    GREEN
                </button>
            </div>
        </section>

        <!-- <div class="message" id="message">
            Нажми кнопку, чтобы начать игру!
        </div> -->

        <button class="start-btn" id="start">
            <span>▶</span> НАЧАТЬ ИГРУ
        </button>

        <div class="game-footer">
            <span>⚡ REACT FAST</span>
            <span>⏱️ TIME IS RUNNING OUT</span>
        </div>
        
        <div class="background-info">
        <div class="game-info" id="gameInfo">
            <h2>Ты выиграл</h2>
            <button>Начать заново</button>
        </div>
        </div>

    </main>

    <script src="./script.js"></script>
</body>
</html>
